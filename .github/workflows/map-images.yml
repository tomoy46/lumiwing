name: inspect uploaded portfolio image
on:
  push:
    paths:
      - '.github/workflows/map-images.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Inspect and convert
        shell: bash
        run: |
          file assets/images/_MG_5467.CR3 || true
          xxd -l 32 assets/images/_MG_5467.CR3 || true
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('assets/images/_MG_5467.CR3')
          out=Path('assets/images/round-table-dessert.jpg')
          try:
              im=Image.open(src)
              print('PIL', im.format, im.size, im.mode)
              im=im.convert('RGB')
              im.save(out,'JPEG',quality=94,subsampling=0,optimize=True)
              print('CREATED',out,im.size)
          except Exception as e:
              print('PIL_ERROR',repr(e))
              raise
          PY
      - name: Commit converted image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/round-table-dessert.jpg
          git diff --cached --quiet || git commit -m "Add web-ready dessert photo"
          git push